<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>حروف</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2312100e%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27%23e8b465%27%3E%D8%AD%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="stage" class="stage"></div>

    <div id="hud" class="hud">
      <span id="clock" class="clock" hidden>00:00</span>
    </div>

    <div id="tray" class="tray" hidden></div>

    <div id="status" class="status" hidden></div>
    <div id="toast" class="toast"></div>

    <div id="latin-hint" class="latin-hint" hidden>
      <div class="keycaps">
        <span class="keycap wide"><i class="caret"></i><span>Space</span></span>
        <svg class="globe" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="17"/>
          <ellipse cx="24" cy="24" rx="7.5" ry="17"/>
          <path d="M7 24h34M9.5 15h29M9.5 33h29"/>
        </svg>
      </div>
    </div>

    <div id="overlay" class="overlay" hidden></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
